aid: cubist
name: Cubist
description: >-
  Cubist builds hardware-backed key management and embedded wallet
  infrastructure for Web3. Its flagship product, CubeSigner, generates and seals
  cryptographic keys inside FIPS 140 HSMs running in AWS Nitro Enclaves and
  enforces transaction approvals with a programmable Policy-as-Code engine. The
  CubeSigner REST API spans organizations, users, roles, keys, policies,
  contacts, sessions, and multi-factor approvals, plus multi-chain signing for
  EVM (Ethereum, Avalanche), Bitcoin/Taproot, Solana, Sui, Tendermint, Ethereum
  validators (eth2), and Babylon Bitcoin staking. Authentication is a two-stage
  OIDC-to-session-token exchange with least-privilege scopes and step-up MFA.
  Cubist is backed by Amplify Partners and Polychain and is SOC 2 compliant.
