    OsInfo:
      type: object
      description: OS information set in [`ClientSessionMetadata`] and reflected in [`SessionMetadata`]
      properties:
        architecture:
          type: string
          example: arm64
          nullable: true
        name:
          type: string
          example: Mac OS
          nullable: true
        version:
          type: string
          example: 14.5.0
          nullable: true
        word_size:
          type: string
          example: 64-bit
          nullable: true
    Status:
      type: object
      required:
      - count
      - num_auth_factors
      - allowed_approvers
      - approved_by
      properties:
        allowed_approvers:
          type: array
          items:
            type: string
          description: Users who are allowed to approve. Must be non-empty.
        allowed_mfa_types:
          type: array
          items:
            $ref: '#/components/schemas/MfaType'
          description: Allowed approval types. When omitted, defaults to any.
          nullable: true
        approved_by:
          type: object
          description: Users who have already approved
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/ApprovalInfo'
        count:
          type: integer
          format: int32
          description: How many users must approve
          minimum: 0
        num_auth_factors:
          type: integer
          format: int32
          description: How many auth factors to require per user
          minimum: 0
        request_comparer:
          $ref: '#/components/schemas/HttpRequestCmp'
    ConflictErrorCode:
      type: string
      enum:
      - ConcurrentRequestDisallowed
      - ConcurrentLockCreation
  responses:
    NewSessionResponse:
      description: Information about a new session, returned from multiple endpoints (e.g., login, refresh, etc.).
      content:
        application/json:
          schema:
            type: object
            description: Information about a new session, returned from multiple endpoints (e.g., login, refresh, etc.).
            required:
            - org_id
            - token
            - refresh_token
            - session_info
            properties:
              expiration:
                type: integer
                format: int64
                description: Session expiration (in seconds since UNIX epoch), beyond which it cannot be refreshed.
                example: 1701879640
                minimum: 0
              org_id:
                $ref: '#/components/schemas/Id'
              refresh_token:
                type: string
                description: Token that can be used to refresh this session.
              session_info:
                $ref: '#/components/schemas/ClientSessionInfo'
              token:
                type: string
                description: 'New token to be used for authentication. Requests to signing endpoints

                  should include this value in the `Authorization` header.'
    AuthenticationResponse:
      description: The response to the idp authenticate endpoint
      content:
        application/json:
          schema:
            type: object
            description: The response to the idp authenticate endpoint
            required:
            - id_token
            properties:
              id_token:
                type: string
                description: An OIDC token that can be used to authenticate with CubeSigner
    PasskeyAssertChallenge:
      description: ''
      content:
        application/json:
          schema:
            allOf:
            - allOf:
              - $ref: '#/components/schemas/ChallengePieces'
              - type: object
                required:
                - options
                properties:
                  options:
                    $ref: '#/components/schemas/PublicKeyCredentialRequestOptions'
              description: 'An extended form of `PublicKeyCredentialRequestOptions` that allows clients to derive the WebAuthn challenge

                from a structured preimage.


                This ensures that the webuathn signature can only be used for a specific purpose'
            - type: object
              required:
              - challenge_id
              properties:
                challenge_id:
                  type: string
                  description: The id of the challenge. Must be supplied when answering the challenge.
  securitySchemes:
    Oidc:
      type: apiKey
      in: header
      name: Authorization
      description: OIDC tokens allow users to authenticate using a third-party service. These are exchanged for signer session tokens.
    SignerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Signing API end-points use session tokens for auth. Specifically, with each request you need to use the \`token\` from your signer session (which you create with `cs token create`).
