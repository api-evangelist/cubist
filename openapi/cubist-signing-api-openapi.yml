      summary: Sign a tendermint message.
      description: 'Sign a tendermint message.


        Signs the given base-64 encoded vote or proposal with the given tendermint key.'
      operationId: tendermintSign
      parameters:
      - name: org_id
        in: path
        description: Name or ID of the desired Org
        required: true
        schema:
          type: string
        example: Org#124dfe3e-3bbd-487d-80c0-53c55e8ab87a
      - name: pubkey
        in: path
        description: Hex-encoded validator public key with 0x prefix
        required: true
        schema:
          type: string
        example: '0x7d8d344e6e53151692fa78a098630799946ad4d6a027ae6bcd7a78dc78281650'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TendermintSignRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/SignResponse'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - SignerAuth:
        - sign:tendermint
  /v1/org/{org_id}/blob/sign/{key_id}:
    post:
      tags:
      - Signing
      summary: Sign Raw Blob
      description: 'Sign Raw Blob


        Signs an arbitrary blob with a given key.


        - ECDSA signatures are serialized as big-endian r and s plus recovery-id

        byte v, which can in general take any of the values 0, 1, 2, or 3.


        - EdDSA signatures are serialized in the standard format.


        - BLS signatures are not supported on the blob-sign endpoint.'
      operationId: blobSign
      parameters:
      - name: org_id
        in: path
        description: Name or ID of the desired Org
        required: true
        schema:
          type: string
        example: Org#124dfe3e-3bbd-487d-80c0-53c55e8ab87a
      - name: key_id
        in: path
        description: ID of the desired Key
        required: true
        schema:
          type: string
        example: Key#124dfe3e-3bbd-487d-80c0-53c55e8ab87a
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlobSignRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/SignResponse'
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - SignerAuth:
        - sign:blob
  /v1/org/{org_id}/eth1/sign/{pubkey}:
    post:
      tags:
      - Signing
      summary: Sign EVM Transaction
      description: 'Sign EVM Transaction


        Signs an Ethereum (and other EVM) transaction with a given Secp256k1 key.

        Returns an RLP-encoded transaction with EIP-155 signature.


        The key must be associated with the role and organization on whose behalf this action is called.'
      operationId: eth1Sign
      parameters:
      - name: org_id
        in: path
        description: Name or ID of the desired Org
        required: true
        schema:
          type: string
        example: Org#124dfe3e-3bbd-487d-80c0-53c55e8ab87a
      - name: pubkey
        in: path
        description: Hex-encoded ethereum address of the secp key
        required: true
        schema:
          type: string
        example: '0x49011adbCC3bC9c0307BB07F37Dda1a1a9c69d2E'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Eth1SignRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Eth1SignResponse'
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - SignerAuth:
        - sign:evm:tx
  /v1/org/{org_id}/eth2/sign/{pubkey}:
    post:
      tags:
      - Signing
      summary: Sign Validator Request
      description: 'Sign Validator Request


        Signs an eth2 validator request with a given BLS key.


        The key must be associated with the role and organization on whose behalf this action is called.'
      operationId: eth2Sign
      parameters:
      - name: org_id
        in: path
        description: Name or ID of the desired Org
        required: true
        schema:
          type: string
        example: Org#124dfe3e-3bbd-487d-80c0-53c55e8ab87a
      - name: pubkey
        in: path
        description: Hex-encoded validator (BLS) public key with 0x prefix
        required: true
        schema:
          type: string
        example: '0x9700fbb8c906942442c2a5b3ad7498f27aedda253786a6fbaa8fef47fb7af234e50cf2cce815a553087992ae565d48da'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Eth2SignRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/SignResponse'
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - SignerAuth:
        - sign:eth2:validate
  /v1/org/{org_id}/eth2/stake:
    post:
      tags:
      - Signing
      summary: Sign Stake Deposit
      description: 'Sign Stake Deposit


        Signs a deposit transaction with a `validator_key`. If `validator_key` is set to a pregenerated key, we use the

        provided validator key. Otherwise, we generate a new BLS key.


        When using a pregenerated key, the key must be associated with the role and organization on whose

        behalf this action is called.'
      operationId: stake
      parameters:
      - name: org_id
        in: path
        description: Name or ID of the desired Org
        required: true
        schema:
          type: string
        example: Org#124dfe3e-3bbd-487d-80c0-53c55e8ab87a
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StakeRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/StakeResponse'
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - SignerAuth:
        - sign:eth2:stake
  /v1/org/{org_id}/eth2/unstake/{pubkey}:
    post:
      tags:
      - Signing
      summary: Sign Unstake Request
      description: 'Sign Unstake Request


        Handle unstaking request, producing a signed voluntary exit message

        that can be posted directly to the Beacon chain.


        The key must be associated with the role and organization on whose behalf this action is called.'
      operationId: unstake
      parameters:
      - name: org_id
        in: path
        description: Name or ID of the desired Org
        required: true
        schema:
          type: string
        example: Org#124dfe3e-3bbd-487d-80c0-53c55e8ab87a
      - name: pubkey
        in: path
        description: Hex-encoded validator (BLS) public key
        required: true
        schema:
          type: string
        example: '0xa99a76ed7796f7be22d5b7e85deeb7c5677e88e511e0b337618f8c4eb61349b4bf2d153f649f7b53359fe8b94a38e44c'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnstakeRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/UnstakeResponse'
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - SignerAuth:
        - sign:eth2:unstake
components:
  schemas:
    BabylonCovStakeExpansionRequest:
      type: object
      description: Request to expand an active stake with additional funds.
      required:
      - previous_active_stake_tx
      - previous_staking_output_idx
      - previous_active_stake_unbonding_script
      - other_funding_output
      properties:
        other_funding_output:
          type: string
          description: 'The transaction output that is being used to fund the stake expansion.

            This is a Bitcoin consensus--encoded hex string.'
        previous_active_stake_tx:
          type: string
          description: 'The active staking transaction that is being expanded with this request.

            This is a Bitcoin consensus--encoded hex string.'
          example: 954ba118e7133b4bb3a67acc4f40cb9529aabbc01007229f7bfd85706850175d77d5cbe5e4c0ca67238d14afa47c51cc
        previous_active_stake_unbonding_script:
          type: string
          description: 'The unbonding script in the active staking transaction.

            This is a Bitcoin consensus--encoded hex string.'
          example: e133f5a923a07b9c7f6767cda171005b
        previous_staking_output_idx:
          type: integer
          format: int32
          description: The index of the active stake output in the active staking transaction.
          example: 1
          minimum: 0
    NotFoundErrorCode:
      type: string
      enum:
      - UriSegmentMissing
      - UriSegmentInvalid
      - TotpNotConfigured
      - FidoKeyNotFound
      - FidoChallengeNotFound
      - TotpChallengeNotFound
      - UserExportRequestNotFound
      - UserExportCiphertextNotFound
      - OrgExportCiphertextNotFound
      - UploadObjectNotFound
      - PolicySecretNotFound
      - BucketMetaNotFound
      - TimestreamDisabled
      - CustomChainNotFound
      - InvitationNotFound
      - TransactionNotFound
      - EmailConfigNotFound
    VoluntaryExit:
      type: object
      description: 'An exit voluntarily submitted a validator who wishes to withdraw.

        The schema for this message is defined

        [here](https://github.com/ethereum/consensus-specs/blob/v1.0.1/specs/phase0/beacon-chain.md#signedvoluntaryexit).'
      required:
      - epoch
      - validator_index
      properties:
        epoch:
          $ref: '#/components/schemas/Epoch'
        validator_index:
          type: string
          description: Index of the exiting validator.
          example: '256'
    HttpRequestCmp:
      oneOf:
      - type: string
        description: The requests must match exactly. Any given MFA receipt can be used at most once.
        enum:
        - Eq
      - type: object
        required:
        - EvmTx
        properties:
          EvmTx:
            $ref: '#/components/schemas/EvmTxCmp'
      - type: object
        required:
        - SolanaTx
        properties:
          SolanaTx:
            $ref: '#/components/schemas/SolanaTxCmp'
      description: How to compare HTTP requests when verifying MFA receipt (see [MfaRequest::verify_request])
    BadGatewayErrorCode:
      type: string
      enum:
      - Generic
      - CustomChainRpcError
      - EsploraApiError
      - SentryApiError
      - CallWebhookError
      - OAuthProviderError
      - OidcDisoveryFailed
      - OidcIssuerJwkEndpointUnavailable
      - SmtpServerUnavailable
    Fork:
      type: object
      description: 'Specifies a fork of the `BeaconChain`, to prevent replay attacks.

        The schema of `Fork` is defined in the [Beacon chain

        spec](https://github.com/ethereum/consensus-specs/blob/v1.0.1/specs/phase0/beacon-chain.md#fork).'
      required:
      - previous_version
      - current_version
      - epoch
      properties:
        current_version:
          type: string
          description: Current fork version.
          example: '0x43434343'
        epoch:
          $ref: '#/components/schemas/Epoch'
        previous_version:
          type: string
          description: Previous fork version.
          example: '0x42424242'
      example:
        current_version: '0x00001020'
        epoch: '0'
        previous_version: '0x00001020'
    SignerErrorCode:
      oneOf:
      - $ref: '#/components/schemas/SignerErrorOwnCodes'
      - $ref: '#/components/schemas/AcceptedValueCode'
      - $ref: '#/components/schemas/BadRequestErrorCode'
      - $ref: '#/components/schemas/BadGatewayErrorCode'
      - $ref: '#/components/schemas/NotFoundErrorCode'
      - $ref: '#/components/schemas/ForbiddenErrorCode'
      - $ref: '#/components/schemas/UnauthorizedErrorCode'
      - $ref: '#/components/schemas/PreconditionErrorCode'
      - $ref: '#/components/schemas/TimeoutErrorCode'
      - $ref: '#/components/schemas/ConflictErrorCode'
      - $ref: '#/components/schemas/InternalErrorCode'
    DiffieHellmanRequest:
      allOf:
      - type: object
        properties:
          dry_run:
            type: boolean
            description: Do not produce a valid signature, just evaluate attached policies.
          explain:
            type: boolean
            description: 'Request additional information to be included in the response, explaining

              the outcome (i.e., permitted vs. denied vs. MFA required) of the sign request.

              Defaults to false.'
          fail_on_mfa:
            type: boolean
            description: 'If MFA is required, fail the request instead of returning 202 and creating

              pending MFA request. Defaults to false.'
          metadata:
            description: 'Optional metadata. Passing additional information as metadata can be used to make reviewing

              of pending MFA requests and/or historical key transactions more transparent. It can also be used e.g., to carry additional data to WebHook policies.'
            nullable: true
      - type: object
        required:
        - points
        properties:
          points:
            type: array
            items:
              type: string
            description: 'The set of serialized elliptic curve points from which to compute shared secrets.

              The serialization format of these points depends on the key type; see the CubeSigner

              documentation for more information.'
            maxItems: 32
            minItems: 1
          public_key:
            type: string
            description: 'An optional NIST P-256 public key (base64-encoded SEC1 with or without compression).


              If provided, the response will be encrypted to this public key using RFC9180

              HPKE-DHKEM(P-256, HKDF-SHA256) with AES-256-GCM as the symmetric cipher.


              If no public key is specified, the results will be returned unencrypted. In this

              case, the input points should be masked with a random scalar to avoid leaking the

              shared secret in the response; the results can be unmasked via point multiplication

              with the inverse of the masking scalar.'
            example: AkpLT/3dXApJzXSduaPQ7apyT0ADBwqkt1es/aT0iWWf
            nullable: true
    BabylonStakingRequest:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/BabylonStakingDeposit'
        - type: object
          required:
          - action
          properties:
            action:
              type: string
              enum:
              - deposit
      - allOf:
        - $ref: '#/components/schemas/BabylonStakingEarlyUnbond'
        - type: object
          required:
          - action
          properties:
            action:
              type: string
              enum:
              - early_unbond
      - allOf:
        - $ref: '#/components/schemas/BabylonStakingWithdrawal'
        - type: object
          required:
          - action
          properties:
            action:
              type: string
              enum:
              - withdraw_timelock
      - allOf:
        - $ref: '#/components/schemas/BabylonStakingWithdrawal'
        - type: object
          required:
          - action
          properties:
            action:
              type: string
              enum:
              - withdraw_early_unbond
      - allOf:
        - $ref: '#/components/schemas/BabylonStakingWithdrawal'
        - type: object
          required:
          - action
          properties:
            action:
              type: string
              enum:
              - withdraw_slashing
      - allOf:
        - $ref: '#/components/schemas/BabylonStakingEarlyUnbond'
        - type: object
          required:
          - action
          properties:
            action:
              type: string
              enum:
              - slash_deposit
      - allOf:
        - $ref: '#/components/schemas/BabylonStakingEarlyUnbond'
        - type: object
          required:
          - action
          properties:
            action:
              type: string
              enum:
              - slash_early_unbond
      description: The actions possible via the Babylon Staking endpoint
      discriminator:
        propertyName: action
    DepositType:
      type: string
      description: The type of deposit to perform
      enum:
      - Canonical
      - Wrapper
    ClientSessionInfo:
      type: object
      description: 'Session information sent to the client.

        This struct works in tandem with its server-side counterpart [`SessionData`].'
      required:
      - session_id
      - auth_token
      - refresh_token
      - epoch
      - epoch_token
      - auth_token_exp
      - refresh_token_exp
      properties:
        auth_token:
          type: string
          description: Token to use for authorization.
        auth_token_exp:
          $ref: '#/components/schemas/EpochDateTime'
        epoch:
          type: integer
          format: int32
          description: Epoch at which the token was last refreshed
          minimum: 0
        epoch_token:
          $ref: '#/components/schemas/B32'
        refresh_token:
          type: string
          description: Token to use for refreshing the `(auth, refresh)` token pair
        refresh_token_exp:
          $ref: '#/components/schemas/EpochDateTime'
        session_id:
          type: string
          description: Session ID
    PrevOutputs:
      oneOf:
      - type: object
        required:
        - One
        properties:
          One:
            type: object
            description: '`One` variant allows provision of the single previous output needed. It''s useful,

              for example, when modifier `SIGHASH_ANYONECANPAY` is provided, only previous output

              of the current input is needed. The first `index` argument is the input index

              this output is referring to.'
            required:
            - index
            - tx_out
            properties:
              index:
                type: integer
                minimum: 0
              tx_out:
                $ref: '#/components/schemas/BtcTxOut'
      - type: object
        required:
        - All
        properties:
          All:
            type: array
            items:
              $ref: '#/components/schemas/BtcTxOut'
            description: 'When `SIGHASH_ANYONECANPAY` is not provided, or when the caller is giving all

              previous outputs so the same variable can be used for multiple inputs.'
      description: Contains outputs of previous transactions.
    BinanceDryRunArgs:
      type: object
      required:
      - method
      - url
      properties:
        method:
          type: string
          description: The Binance API method that would have been used
        url:
          type: string
          description: The Binance API url method that would have been called
    BabylonCovSignRequest:
      allOf:
      - type: object
        properties:
          dry_run:
            type: boolean
            description: Do not produce a valid signature, just evaluate attached policies.
          explain:
            type: boolean
            description: 'Request additional information to be included in the response, explaining

              the outcome (i.e., permitted vs. denied vs. MFA required) of the sign request.

              Defaults to false.'
          fail_on_mfa:
            type: boolean
            description: 'If MFA is required, fail the request instead of returning 202 and creating

              pending MFA request. Defaults to false.'
          metadata:
            description: 'Optional metadata. Passing additional information as metadata can be used to make reviewing

              of pending MFA requests and/or historical key transactions more transparent. It can also be used e.g., to carry additional data to WebHook policies.'
            nullable: true
      - type: object
        required:
        - staking_tx
        - slashing_tx
        - unbonding_tx
        - slash_unbonding_tx
        - staking_output_idx
        - slashing_script
        - unbonding_script
        - unbonding_slashing_script
        - fp_enc_keys
        properties:
          fp_enc_keys:
            type: array
            items:
              type: string
            description: 'The keys for the finality providers to which this transaction is being staked.

              Each key is a hex string containing a SEC1-encoded secp256k1 public key.'
            example:
            - 03b573e318803fd7aee1be5b6b18d496cc60ecc52429dbd477a879217c3ed26a795cb4f4e880aaff3a6ad66335e5404fa51caeb4964f0c9f7562737864e3bde5bc
          slash_unbonding_tx:
            type: string
            description: 'The slash-unbonding transaction being approved by the covenant signer.

              This is a Bitcoin consensus--encoded hex string.'
            example: 6899b5baf713a2c60e6abf05e8909440d41dc4125b98891c332f7087daf017fb2436286e2aa097464d9c927d644fa6de
          slashing_script:
            type: string
            description: 'The slashing script in the staking transaction.

              This is a Bitcoin consensus--encoded hex string.'
            example: 877f05cc626dedcf53b50eeba0821ca0
          slashing_tx:
            type: string
            description: 'The slashing transaction being approved by the covenant signer.

              This is a Bitcoin consensus--encoded hex string.'
            example: f37e7ca2b24a5f7b8b6c9ba054f9932efb047ce80cf50a118e3f72751429fb13a355fa093bd358cdc30efacf5a62cabe
          stake_expansion:
            allOf:
            - $ref: '#/components/schemas/BabylonCovStakeExpansionRequest'
            nullable: true
          staking_output_idx:
            type: integer
            format: int32
            description: The output index of the Babylon staking scripts in the staking transaction.
            example: 1
            minimum: 0
          staking_tx:
            type: string
            description: 'The staking transaction being approved by the covenant signer.

              This is a Bitcoin consensus--encoded hex string.'
            example: 954ba118e7133b4bb3a67acc4f40cb9529aabbc01007229f7bfd85706850175d77d5cbe5e4c0ca67238d14afa47c51cc
          unbonding_script:
            type: string
            description: 'The unbonding script in the staking transaction.

              This is a Bitcoin consensus--encoded hex string.'
            example: 55f6638c0c0c0b0e51ca922e0e9e6abd
          unbonding_slashing_script:
            type: string
            description: 'The slashing script in the unbonding transaction.

              This is a Bitcoin consensus--encoded hex string.'
            example: e133f5a923a07b9c7f6767cda171005b
          unbonding_tx:
            type: string
            description: 'The unbonding transaction being approved by the covenant signer.

              This is a Bitcoin consensus--encoded hex string.'
            example: 969cb95129a55a96d51919f5f67f3adc597ecdee6eda21e7777f370c3b1809336ee7d08ec574c8bbb361ff63d032a976
    DepositTxn:
      type: object
      description: Information produced by a successful deposit
      required:
      - new_validator_pk
      - chain_id
      - deposit_txn
      properties:
        chain_id:
          type: integer
          format: int64
          description: Chain ID for which the deposit transaction was created
          minimum: 1
        deposit_txn:
          type: object
          description: The deposit transaction. Includes only `to`, `value`, and `data` fields.
        new_validator_pk:
          type: string
          description: The hex-encoded compressed form of the new validator BLS public key
      example:
        chain_id: 5
        deposit_txn:
          data: 0x...
          to: '0xff50ed3d0ec03ac01d4c79aad74928bff48a7b2b'
          value: '0x1bc16d674ec800000'
        new_validator_pk: 9700fbb8c906942442c2a5b3ad7498f27aedda253786a6fbaa8fef47fb7af234e50cf2cce815a553087992ae565d48da
    SignerErrorOwnCodes:
      type: string
      enum:
      - PreComputed
      - StatusCodeWithMessage
      - JrpcError
      - UnhandledError
      - ProxyStartError
      - EnclaveError
      - PolicyErrorWithEvalTree
      - RpcApi
    BtcSighashType:
      type: string
      enum:
      - All
      - None
      - Single
      - AllPlusAnyoneCanPay
      - NonePlusAnyoneCanPay
      - SinglePlusAnyoneCanPay
    BlobSignRequest:
      allOf:
      - type: object
        properties:
          dry_run:
            type: boolean
            description: Do not produce a valid signature, just evaluate attached policies.
          explain:
            type: boolean
            description: 'Request additional information to be included in the response, explaining

              the outcome (i.e., permitted vs. denied vs. MFA required) of the sign request.

              Defaults to false.'
          fail_on_mfa:
            type: boolean
            description: 'If MFA is required, fail the request instead of returning 202 and creating

              pending MFA request. Defaults to false.'
          metadata:
            description: 'Optional metadata. Passing additional information as metadata can be used to make reviewing

              of pending MFA requests and/or historical key transactions more transparent. It can also be used e.g., to carry additional data to WebHook policies.'
            nullable: true
      - type: object
        required:
        - message_base64
        properties:
          adaptor_pk:
            type: string
            description: 'An optional base64 string comprising a SEC1-encoded secp256k1 public key.

              This field can be used *only* with Schnorr keys.


              If this field is present, the response will be a Schnorr adaptor signature

              in the format specified by Blockstream for use in libsecp256k1-zkp. See

              <https://github.com/ZhePang/Python_Specification_for_Schnorr_Adaptor/>

              for more information.'
            example: Arny4WoHDNBVXYcynhNl9/y7JttJ2rk0CCRfLR7t3aDg
            nullable: true
          bls_dst:
            type: string
            description: 'An optional domain separation tag for use *only* with BLS signing requests.

              This field must not be supplied for requests involving non-BLS key types.


              If this field is not present or null, the domain separation tag specified in

              the IETF BLS Signatures draft versions 4 and 5, section 4.2.3 (minimal pubkey

              size variant) is used.


              Otherwise, this field must contain a base-64 string encoding a non-empty byte

              vector. When using a custom tag, RFC9380 (Section 3.1) recommends a length of

              at least 16 bytes.'
            example: EbbLvCxI7gan71iISDsfr46etOv606QkGGDP5PpVl5Q=
            nullable: true
          message_base64:
            type: string
            description: 'The blob to sign, encoded as a base64 string.


              Note that certain signing keys impose additional requirements on the contents of

              the message. For example, Secp256k1 keys require that the message is 32 bytes long.'
          segwit_tweak:
            type: string
            description: 'An optional tweak value for use only with (some) secp256k1 key types.

              This field must not be supplied for requests involving any other key type.


              If this field is not present or null, no tweak is applied. Otherwise, this field

              must contain a base-64 string encoding a vector of exactly 32 bytes. See the

              CubeSigner documentation for more information on the Segwit tweaking procedure.'
            example: F41HAy2q5Gn8laF2CuMsZbRAQTmD+4Ob3VUMZ7TBGK4=
            nullable: true
          taproot_tweak:
            type: string
            description: 'An optional tweak value for use *only* with Taproot keys. This field must not

              be supplied for requests involving any other key type.


              If this field is not present or null, no tweak is applied. If the field is an

              empty string, the key is tweaked with an unspendable script path per BIP0341.

              Otherwise, this field must contain a 32-byte, base-64 string representing the

              Merkle root with which to tweak the key before signing.'
            example: F41HAy2q5Gn8laF2CuMsZbRAQTmD+4Ob3VUMZ7TBGK4=
            nullable: true
      example:
        message_base64: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTYK
