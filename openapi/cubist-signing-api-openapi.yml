          description: 'Hash type of an input''s signature, encoded in the last byte of the signature.

            Possible values:

            - SIGHASH_ALL

            - SIGHASH_ALL|SIGHASH_ANYONECANPAY

            - SIGHASH_DEFAULT

            - SIGHASH_NONE

            - SIGHASH_NONE|SIGHASH_ANYONECANPAY

            - SIGHASH_SINGLE

            - SIGHASH_SINGLE|SIGHASH_ANYONECANPAY'
          example: SIGHASH_ALL
